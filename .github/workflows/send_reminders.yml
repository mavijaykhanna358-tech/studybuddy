name: Send Task Reminders

on:
  schedule:
    # 03:30 UTC every day.
    - cron: '30 3 * * *'

  # Allows a manual run from the Actions tab.
  workflow_dispatch:

jobs:
  send-reminders:

    runs-on: ubuntu-latest

    env:

      # This is a batch job, not a web request, so it runs with
      # DEBUG off. Django then requires a SECRET_KEY of at least
      # 50 characters and turns on the HTTPS-only cookie flags.
      DJANGO_ENV: production

      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      DEFAULT_FROM_EMAIL: ${{ secrets.DEFAULT_FROM_EMAIL }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Send task reminders
        run: |
          python manage.py send_task_reminders
