{% if messages %}
<div
    class="sb-toasts"
    role="status"
    aria-live="polite"
>

    {% for message in messages %}
        <div class="sb-alert sb-alert--{{ message.tags|default:'info' }}">

            <svg class="sb-alert__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                {% if 'success' in message.tags %}
                    <circle cx="12" cy="12" r="9"/>
                    <path d="m8.4 12.2 2.5 2.5 4.7-4.9"/>
                {% elif 'error' in message.tags %}
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 7.8v5M12 16.2h.01"/>
                {% elif 'warning' in message.tags %}
                    <path d="M12 3.4 21 19.4H3Z"/>
                    <path d="M12 9.4v4M12 16.8h.01"/>
                {% else %}
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 11v5.4M12 7.8h.01"/>
                {% endif %}
            </svg>

            <span class="sb-alert__text">
                {{ message }}
            </span>

            <button
                type="button"
                class="sb-alert__close"
                aria-label="Dismiss message"
            >
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <path d="M6 6 18 18M18 6 6 18"/>
                </svg>
            </button>

        </div>
    {% endfor %}

</div>
{% endif %}
