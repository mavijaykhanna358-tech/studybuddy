{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        <label>Username</label>
        <input type="text" name="username" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p class="small"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
    <p class="small">No account yet? <a href="{% url 'register' %}">Register here</a>.</p>
</div>
{% endblock %}
