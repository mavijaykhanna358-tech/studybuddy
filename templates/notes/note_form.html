{% extends 'base.html' %}

{% block content %}
<div class="card p-4">
    <h2 class="mb-4">{% if note %}Edit Note{% else %}Add Note{% endif %}</h2>
    <form method="post" class="row g-3">
        {% csrf_token %}
        {% for field in form %}
            <div class="col-12">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <div class="text-danger small">{{ error }}</div>
                {% endfor %}
            </div>
        {% endfor %}
        <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            {% if note %}
                <a href="{% url 'note_detail' note.pk %}" class="btn btn-outline-secondary">Cancel</a>
            {% else %}
                <a href="{% url 'notes' %}" class="btn btn-outline-secondary">Cancel</a>
            {% endif %}
        </div>
    </form>
</div>
{% endblock %}
