{% extends 'base.html' %}

{% block content %}
<div class="card p-4">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h2 class="mb-1">{{ note.title }}</h2>
            <div class="text-muted">{{ note.subject.name|default:'General' }}</div>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <a href="{% url 'note_edit' note.pk %}" class="btn btn-outline-primary">Edit</a>
            <a href="{% url 'note_delete' note.pk %}" class="btn btn-outline-danger">Delete</a>
        </div>
    </div>

    <div class="mb-4">
        <div class="text-muted small mb-2">Last updated: {{ note.updated_at|date:'M d, Y' }}</div>
        <div>{{ note.content|linebreaksbr }}</div>
    </div>

    <a href="{% url 'notes' %}" class="btn btn-outline-secondary">Back to Notes</a>
</div>
{% endblock %}
