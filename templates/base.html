<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyBuddy</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --background: #f4f7fb;
            --white: #ffffff;
            --text: #172033;
            --muted: #64748b;
            --border: #e2e8f0;
            --sidebar-width: 300px;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        body.mobile-nav-open {
            overflow: hidden;
        }

        a {
            text-decoration: none;
        }

        img {
            max-width: 100%;
            height: auto;
        }


        /* =====================================================
           AUTHENTICATED APP
        ===================================================== */

        .app-layout {
            width: 100%;
            min-height: 100vh;
            display: flex;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {
            position: fixed;

            top: 0;
            left: 0;
            bottom: 0;

            width: var(--sidebar-width);

            background: linear-gradient(
                180deg,
                #0f1f4d 0%,
                #173b91 100%
            );

            color: white;

            padding: 24px 16px;

            display: flex;
            flex-direction: column;

            z-index: 1000;

            box-shadow:
                8px 0 25px rgba(15, 23, 42, 0.12);

            transition:
                transform 0.3s ease;
        }


        /* Sidebar brand */

        .sidebar-header {
            padding: 4px 8px 20px;
        }

        .sidebar-brand {
            color: white;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: -1px;
        }

        .sidebar-brand:hover {
            color: white;
        }


        /* Sidebar navigation */

        .sidebar-nav {
            display: flex;
            flex-direction: column;

            gap: 6px;

            flex: 1;
        }

        .sidebar-link {
            display: flex;
            align-items: center;

            min-height: 48px;

            padding: 12px 14px;

            border-radius: 12px;

            color: rgba(255, 255, 255, 0.82);

            font-size: 15px;

            font-weight: 600;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .sidebar-link:hover {
            color: white;

            background:
                rgba(255, 255, 255, 0.12);

            transform: translateX(3px);
        }

        .sidebar-link.active {
            color: white;

            background:
                rgba(255, 255, 255, 0.16);
        }


        /* Logout */

        .logout-box {
            padding-top: 16px;

            border-top:
                1px solid rgba(255, 255, 255, 0.12);
        }


        /* =====================================================
           MAIN AREA
        ===================================================== */

        .main-area {
            width: calc(100% - var(--sidebar-width));

            min-height: 100vh;

            margin-left: var(--sidebar-width);

            display: flex;
            flex-direction: column;
        }


        /* =====================================================
           MAIN CONTENT
        ===================================================== */

        .main-content {
            width: 100%;

            min-height: 100vh;

            padding: 32px 40px 40px;
        }

        .content-shell {
            width: 100%;

            max-width: 1200px;

            margin: 0 auto;
        }


        /* =====================================================
           MOBILE TOP BAR
        ===================================================== */

        .mobile-topbar {
            display: none;

            width: 100%;

            height: 64px;

            padding: 0 16px;

            align-items: center;

            justify-content: space-between;

            background:
                linear-gradient(
                    90deg,
                    var(--primary-dark),
                    var(--primary)
                );

            color: white;

            position: sticky;

            top: 0;

            z-index: 900;

            box-shadow:
                0 5px 20px rgba(37, 99, 235, 0.18);
        }

        .mobile-brand {
            color: white;

            font-size: 23px;

            font-weight: 800;

            letter-spacing: -0.5px;
        }

        .mobile-menu-toggle {
            width: 42px;

            height: 42px;

            border: none;

            border-radius: 10px;

            background: transparent;

            color: white;

            font-size: 26px;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;
        }

        .mobile-menu-toggle:hover {
            background:
                rgba(255, 255, 255, 0.12);
        }


        /* =====================================================
           MOBILE BACKDROP
        ===================================================== */

        .mobile-backdrop {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(15, 23, 42, 0.50);

            z-index: 950;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;
        }

        body.mobile-nav-open .mobile-backdrop {
            opacity: 1;

            visibility: visible;
        }


        /* =====================================================
           PAGE HEADER
        ===================================================== */

        .page-header {
            width: 100%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 16px;

            margin-bottom: 24px;

            flex-wrap: wrap;
        }

        .page-header h1,
        .page-header h2,
        .page-header h3,
        .page-header h4 {
            margin: 0;
        }

        .page-subtitle {
            margin-top: 5px;

            color: var(--muted);
        }


        /* =====================================================
           CARDS
        ===================================================== */

        .card {
            width: 100%;

            background: var(--white);

            border:
                1px solid rgba(148, 163, 184, 0.18);

            border-radius: var(--radius);

            box-shadow: var(--shadow);

            padding: 20px;

            overflow-wrap: anywhere;
        }


        /* =====================================================
           STATISTICS
        ===================================================== */

        .stat-grid {
            width: 100%;

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 16px;

            margin-bottom: 24px;
        }

        .stat-card {
            min-width: 0;

            min-height: 140px;

            padding: 20px;

            background: white;

            border:
                1px solid var(--border);

            border-radius: 16px;

            box-shadow:
                0 8px 22px
                rgba(15, 23, 42, 0.06);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 30px
                rgba(15, 23, 42, 0.10);
        }

        .stat-card-label {
            margin: 0;

            color: var(--muted);

            font-size: 14px;

            font-weight: 600;
        }

        .stat-card-value {
            margin: 8px 0 0;

            font-size: 32px;

            font-weight: 800;

            color: var(--text);
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .btn {
            border-radius: 10px;

            font-weight: 600;
        }


        /* =====================================================
           FORMS
        ===================================================== */

        .form-control,
        .form-select,
        textarea {
            width: 100%;

            max-width: 100%;

            border:
                1px solid var(--border);

            border-radius: 10px;

            padding: 10px 12px;
        }

        .form-control:focus,
        .form-select:focus,
        textarea:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.12);
        }

        .form-label {
            font-weight: 600;
        }


        /* =====================================================
           TABLE
        ===================================================== */

        .table-responsive {
            width: 100%;

            max-width: 100%;

            overflow-x: auto;
        }

        .table {
            min-width: 600px;
        }


        /* =====================================================
           GUEST PAGES
           LOGIN / REGISTER / FORGOT PASSWORD
        ===================================================== */

        .guest-layout {
            width: 100%;

            min-height: 100vh;
        }

        .main-content.is-guest {
            width: 100%;

            min-height: 100vh;

            padding: 0;
        }

        .main-content.is-guest
        .content-shell {
            width: 100%;

            max-width: 100%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px 20px;
        }


        /* Login/register cards if used */

        .auth-card {
            width: 100%;

            max-width: 500px;

            margin: 0 auto;

            background: white;

            border-radius: 18px;

            padding: 30px;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.10);
        }


        /* =====================================================
           MOBILE / TABLET
        ===================================================== */

        @media (max-width: 1023px) {

            .sidebar {
                width: min(300px, 82vw);

                transform:
                    translateX(-110%);
            }

            body.mobile-nav-open .sidebar {
                transform:
                    translateX(0);
            }

            .main-area {
                width: 100%;

                margin-left: 0;
            }

            .mobile-topbar {
                display: flex;
            }

            .mobile-backdrop {
                display: block;
            }

            .main-content {
                width: 100%;

                padding:
                    24px 20px 32px;
            }

            .content-shell {
                max-width: 100%;
            }

        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media
        (min-width: 768px)
        and
        (max-width: 1023px) {

            .stat-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 767px) {

            .main-content {
                padding:
                    20px 16px 32px;
            }

            .stat-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));

                gap: 10px;
            }

            .stat-card {
                min-height: 115px;

                padding: 14px;
            }

            .stat-card-value {
                font-size: 25px;
            }

            .stat-card-label {
                font-size: 12px;
            }

            .page-header {
                align-items: flex-start;

                flex-direction: column;
            }

            .page-header .btn {
                width: 100%;
            }

            .card {
                padding: 16px;
            }

            .auth-card {
                padding: 22px 18px;
            }

            .main-content.is-guest
            .content-shell {
                padding:
                    20px 12px;
            }

        }


        /* =====================================================
           VERY SMALL MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            .stat-grid {
                grid-template-columns:
                    1fr 1fr;
            }

            .stat-card {
                padding: 11px;
            }

            .stat-card-value {
                font-size: 22px;
            }

            .mobile-brand {
                font-size: 20px;
            }

        }


        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 1024px) {

            .sidebar {
                transform:
                    translateX(0);
            }

            .mobile-topbar,
            .mobile-backdrop {
                display: none;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     MAIN APPLICATION WRAPPER
========================================================= -->

<div class="{% if user.is_authenticated %}app-layout{% else %}guest-layout{% endif %}">


    <!-- =====================================================
         AUTHENTICATED USER
    ===================================================== -->

    {% if user.is_authenticated %}


        <!-- =================================================
             SIDEBAR
        ================================================= -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <a
                    href="{% url 'dashboard' %}"
                    class="sidebar-brand"
                >
                    StudyBuddy
                </a>

            </div>


            <nav class="sidebar-nav">


                <!-- Dashboard -->

                <a
                    href="{% url 'dashboard' %}"
                    class="sidebar-link {% if request.path == '/dashboard/' %}active{% endif %}"
                >
                    Dashboard
                </a>


                <!-- Subjects -->

                <a
                    href="{% url 'subjects' %}"
                    class="sidebar-link {% if '/subjects/' in request.path %}active{% endif %}"
                >
                    Subjects
                </a>


                <!-- Tasks -->

                <a
                    href="{% url 'tasks' %}"
                    class="sidebar-link {% if '/tasks/' in request.path %}active{% endif %}"
                >
                    Tasks
                </a>


                <!-- Notes -->

                <a
                    href="{% url 'notes' %}"
                    class="sidebar-link {% if '/notes/' in request.path %}active{% endif %}"
                >
                    Notes
                </a>


                <!-- Profile -->

                <a
                    href="{% url 'profile' %}"
                    class="sidebar-link {% if '/profile/' in request.path %}active{% endif %}"
                >
                    Profile
                </a>


            </nav>


            <!-- Logout -->

            <div class="logout-box">

                <form
                    method="post"
                    action="{% url 'logout' %}"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-light w-100"
                    >
                        Logout
                    </button>

                </form>

            </div>

        </aside>


        <!-- =================================================
             MAIN AREA
        ================================================= -->

        <div class="main-area">


            <!-- Mobile navbar -->

            <div class="mobile-topbar">

                <button
                    type="button"
                    class="mobile-menu-toggle"
                    aria-label="Open menu"
                    aria-expanded="false"
                >
                    ☰
                </button>


                <div class="mobile-brand">
                    StudyBuddy
                </div>


                <div style="width:42px;"></div>

            </div>


            <!-- Mobile background overlay -->

            <div class="mobile-backdrop"></div>


    {% endif %}


    <!-- =====================================================
         MAIN CONTENT

         IMPORTANT:
         THERE IS ONLY ONE BLOCK CONTENT
    ===================================================== -->

    <main
        class="main-content {% if not user.is_authenticated %}is-guest{% endif %}"
    >

        <div class="content-shell">


            <!-- Django messages -->

            {% if messages %}

                {% for message in messages %}

                    <div
                        class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
                        role="alert"
                    >

                        {{ message }}

                        <button
                            type="button"
                            class="btn-close"
                            data-bs-dismiss="alert"
                            aria-label="Close"
                        ></button>

                    </div>

                {% endfor %}

            {% endif %}


            <!-- =================================================
                 CHILD PAGE CONTENT

                 DO NOT ADD ANOTHER BLOCK ANYWHERE
            ================================================== -->

            {% block content %}
            {% endblock %}


        </div>

    </main>


    <!-- =====================================================
         CLOSE AUTHENTICATED MAIN AREA
    ===================================================== -->

    {% if user.is_authenticated %}

        </div>

    {% endif %}


</div>


<!-- =========================================================
     BOOTSTRAP JS
========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- =========================================================
     MOBILE MENU JAVASCRIPT
========================================================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const menuButton =
            document.querySelector(
                ".mobile-menu-toggle"
            );


        const backdrop =
            document.querySelector(
                ".mobile-backdrop"
            );


        const sidebar =
            document.querySelector(
                ".sidebar"
            );


        const sidebarLinks =
            document.querySelectorAll(
                ".sidebar-link"
            );


        /* ================================================
           OPEN / CLOSE MOBILE MENU
        ================================================= */

        if (menuButton) {

            menuButton.addEventListener(
                "click",
                function () {


                    const isOpen =
                        document.body.classList.toggle(
                            "mobile-nav-open"
                        );


                    menuButton.setAttribute(
                        "aria-expanded",
                        String(isOpen)
                    );


                }
            );

        }


        /* ================================================
           CLICK OUTSIDE SIDEBAR
        ================================================= */

        if (backdrop) {

            backdrop.addEventListener(
                "click",
                function () {


                    document.body.classList.remove(
                        "mobile-nav-open"
                    );


                    if (menuButton) {

                        menuButton.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }

                }
            );

        }


        /* ================================================
           CLOSE MENU AFTER CLICKING LINK
        ================================================= */

        sidebarLinks.forEach(
            function (link) {

                link.addEventListener(
                    "click",
                    function () {


                        if (
                            window.innerWidth <= 1023
                        ) {

                            document.body.classList.remove(
                                "mobile-nav-open"
                            );


                            if (menuButton) {

                                menuButton.setAttribute(
                                    "aria-expanded",
                                    "false"
                                );

                            }

                        }

                    }
                );

            }
        );


        /* ================================================
           CLOSE MENU WITH ESC
        ================================================= */

        document.addEventListener(
            "keydown",
            function (event) {


                if (
                    event.key === "Escape"
                ) {


                    document.body.classList.remove(
                        "mobile-nav-open"
                    );


                    if (menuButton) {

                        menuButton.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }

                }

            }
        );


        /* ================================================
           RESET MOBILE MENU ON DESKTOP
        ================================================= */

        window.addEventListener(
            "resize",
            function () {


                if (
                    window.innerWidth >= 1024
                ) {


                    document.body.classList.remove(
                        "mobile-nav-open"
                    );


                    if (menuButton) {

                        menuButton.setAttribute(
                            "aria-expanded",
                            "false"
                        );

                    }

                }

            }
        );


    }
);

</script>


</body>

</html>
