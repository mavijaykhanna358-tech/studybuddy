{% extends 'base.html' %}

{% block content %}
<div class="card p-4">
    <h2 class="mb-3">Delete {{ object_type|title }}?</h2>
    <p>Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 flex-wrap">
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
            <a href="{{ back_url }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
