{% extends 'base.html' %}

{% block content %}

<style>

.task-delete-page {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 50px 20px;
    box-sizing: border-box;
}

.task-delete-card {
    background: #ffffff;
    border: 1px solid #e5eaf0;
    border-radius: 18px;
    padding: 35px 30px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(30, 60, 100, 0.08);
}

.delete-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff1f2;
    border-radius: 50%;
    font-size: 30px;
}

.delete-title {
    margin: 0 0 10px;
    color: #172033;
    font-size: 27px;
    font-weight: 700;
}

.delete-text {
    margin: 0 0 12px;
    color: #60738c;
    font-size: 15px;
}

.task-name {
    display: inline-block;
    max-width: 100%;
    margin: 5px 0 22px;
    padding: 9px 16px;
    background: #f1f4f8;
    border-radius: 20px;
    color: #172033;
    font-size: 16px;
    font-weight: 700;
    word-break: break-word;
}

.warning-box {
    background: #fff8e8;
    border: 1px solid #f3dfaa;
    border-radius: 10px;
    padding: 12px 15px;
    margin-bottom: 25px;
    color: #8a6700;
    font-size: 13px;
}

.delete-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.delete-actions .btn {
    min-width: 125px;
    border-radius: 9px;
    font-weight: 600;
}

@media (max-width: 600px) {

    .task-delete-page {
        padding: 25px 14px 35px;
    }

    .task-delete-card {
        padding: 28px 18px;
    }

    .delete-actions {
        flex-direction: column;
    }

    .delete-actions .btn {
        width: 100%;
    }

}

</style>


<div class="task-delete-page">

    <div class="task-delete-card">

        <div class="delete-icon">
            🗑️
        </div>

        <h1 class="delete-title">
            Delete Task?
        </h1>

        <p class="delete-text">
            Are you sure you want to delete this task?
        </p>

        <div class="task-name">
            {{ task.title }}
        </div>

        <div class="warning-box">
            This action cannot be undone.
        </div>

        <form method="post">

            {% csrf_token %}

            <div class="delete-actions">

                <a
                    href="{% url 'task_detail' task.pk %}"
                    class="btn btn-outline-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Yes, Delete
                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
