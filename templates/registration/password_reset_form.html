{% extends 'base.html' %}

{% block content %}
<div class="card auth-card">
    <h2>Reset Password</h2>
    <p class="text-center muted mb-4">Enter your email address and we will send you instructions to reset your password.</p>
    <form method="post" action="{% url 'password_reset' %}" class="row g-3">
        {% csrf_token %}
        <div class="col-12">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
        </div>
    </form>
</div>
{% endblock %}
