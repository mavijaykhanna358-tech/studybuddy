{% extends 'base.html' %}

{% block title %}Check your email - StudyBuddy{% endblock %}

{% block content %}


<div class="sb-auth">

    <div class="sb-auth__card">

        <div
            class="sb-auth__mark"
            style="background: linear-gradient(135deg, var(--sb-teal), var(--sb-green)); box-shadow: 0 12px 28px rgba(6, 182, 212, 0.32);"
            aria-hidden="true"
        >
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h15A1.5 1.5 0 0 1 21 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 16.5z"></path><path d="M3.5 7l8.5 6 8.5-6"></path></svg>
        </div>


        <h1 class="sb-auth__title">
            Check your email
        </h1>

        <p class="sb-auth__sub">
            If that address has an account, a reset link is on
            its way. It expires in a few hours.
        </p>


        <div class="sb-auth__links">

            <a href="{% url 'password_reset' %}">
                Send it again
            </a>

            <span aria-hidden="true">&middot;</span>

            <a href="{% url 'login' %}">
                Back to log in
            </a>

        </div>

    </div>

</div>


{% endblock %}
