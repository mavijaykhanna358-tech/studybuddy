{% extends 'base.html' %}

{% block title %}Password updated - StudyBuddy{% endblock %}

{% block content %}


<div class="sb-auth">

    <div class="sb-auth__card">

        <div
            class="sb-auth__mark"
            style="background: linear-gradient(135deg, var(--sb-teal), var(--sb-green)); box-shadow: 0 12px 28px rgba(6, 182, 212, 0.32);"
            aria-hidden="true"
        >
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
        </div>


        <h1 class="sb-auth__title">
            Password updated
        </h1>

        <p class="sb-auth__sub">
            Your new password is saved. Log in with it to get
            back to your planner.
        </p>


        <a
            href="{% url 'login' %}"
            class="sb-btn sb-btn--primary sb-btn--lg sb-btn--block"
        >
            Go to log in
        </a>

    </div>

</div>


{% endblock %}
